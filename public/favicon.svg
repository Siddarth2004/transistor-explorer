<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#050510"/>
  <!-- Transistor schematic symbol -->
  <!-- Base line -->
  <line x1="10" y1="16" x2="16" y2="16" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <!-- Vertical bar -->
  <line x1="16" y1="9" x2="16" y2="23" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <!-- Collector -->
  <line x1="16" y1="11" x2="24" y2="7" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Emitter with arrow -->
  <line x1="16" y1="21" x2="23" y2="25" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="23,25 19.5,23.5 21,27" fill="#a78bfa"/>
</svg>
